name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check links
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          node scripts/check-links.mjs http://localhost:3000
